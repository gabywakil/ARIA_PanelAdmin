const srch=(id,ph,fn,v)=>`<div class="sr"><span>${ic("search",18)}</span><input placeholder="${ph}" value="${v}" oninput="${fn}"></div>`;
function body(){
if(tab=="Resumen"){const ap=A.filter(a=>a.s=="Pendiente").length;return`<div class="kpis">${kpi("Ventas del mes",ventas(),"$","+12%",[18,26,31,29,40,48],1)}${kpi("Pedidos",O.length,"","+8%",[3,5,4,7,6,9])}${kpi("Cotizaciones hoy",7,"","+3",[2,4,3,6,5,7])}${kpi("Aliados por revisar",ap,"","",[1,0,2,1,3,ap])}</div><div class="grid2"><div class="panel" id="ch">${chart()}</div><div class="panel"><h3>Por categoría</h3>${donut()}</div></div><div class="grid2 g2b"><div><div class="hd2"><h3>Pedidos recientes</h3><a class="lnk" onclick="go('Pedidos')">Ver todos</a></div><div class="list">${O.slice(0,4).map(orow).join("")}</div></div><div><div class="hd2"><h3>Stock bajo</h3><a class="lnk" onclick="go('Productos')">Inventario</a></div><div class="panel">${P.filter(p=>p.s<=3).map(p=>`<div class="stk"><div class="tot"><span>${p.n}</span><b>${p.s} uds.</b></div><div class="bar2"><i style="width:${p.s/10*100}%"></i></div></div>`).join("")||"<p style='color:var(--m)'>Todo en orden.</p>"}<button class="btn" style="width:100%;margin-top:14px" onclick="openProd(0)">Nuevo producto</button></div></div></div>`}
if(tab=="Productos")return`<div class="tb">${srch("p","Buscar producto…","pq=this.value;$('#pl').innerHTML=plist()",pq)}<button class="btn" onclick="openProd(0)">${ic("plus",18)} Nuevo producto</button></div><div class="fch">${["Todos",...CATS].map(c=>`<span class="chip ${c==pcat?"on":""}" onclick="pcat='${c}';render()">${c}</span>`).join("")}</div><div id="pl">${plist()}</div>`;
if(tab=="Pedidos")return`<div class="tb">${srch("o","Buscar por cliente o factura…","oq=this.value;$('#ol').innerHTML=olist()",oq)}</div><div class="fch">${["Todos","Cotizado","Pendiente","Pagado","Entregado"].map(c=>`<span class="chip ${c==of?"on":""}" onclick="of='${c}';render()">${c} ${c=="Todos"?"":O.filter(o=>o.e==c).length}</span>`).join("")}</div><div id="ol">${olist()}</div><div class="note">Cada factura tiene PDF descargable y se envía al correo del cliente.</div>`;
if(tab=="Clientes")return`<div class="tb">${srch("c","Buscar cliente…","cq=this.value;$('#cl').innerHTML=clist()",cq)}</div><div id="cl">${clist()}</div>`;
if(tab=="Aliados"){const l=A.filter(a=>a.s==at);return`<div class="seg" style="margin-bottom:14px">${["Pendiente","Aprobado","Rechazado"].map(s=>`<button class="${s==at?"on":""}" onclick="at='${s}';render()">${s}s (${A.filter(a=>a.s==s).length})</button>`).join("")}</div>${l.map(a=>`<div class="panel ali"><div class="hd"><div style="display:flex;gap:12px;align-items:center"><span class="tl2">${ini(a.e)}</span><div><b>${a.e}</b><br><small style="color:var(--m)">${a.r}</small></div></div>${pill(a.s)}</div><p>${ic("users",16)} ${a.c} · ${a.tel}</p><p>${ic("mail",16)} ${a.mail}</p><p>${ic("tag",16)} Interés: ${a.i} · ${a.f}</p>${a.s=="Pendiente"?`<div class="acts"><button class="btn" onclick="dec(${a.id},'Aprobado')">Aprobar</button><button class="btn x" onclick="dec(${a.id},'Rechazado')">Rechazar</button></div>`:""}</div>`).join("")||`<div class="panel" style="text-align:center;color:var(--m)">No hay solicitudes aquí</div>`}`}
return`<div class="grid2" style="grid-template-columns:1fr 1fr"><div class="panel"><h3>Hero de la página</h3><label>Título</label><input id="ht" value="${H.t}" oninput="H.t=this.value;pv()"><label>Descripción</label><textarea id="hs" rows="3" oninput="H.s=this.value;pv()">${H.s}</textarea><label>Banner</label><div class="up" onclick="toast('Aquí se sube el banner')">${ic("down",20)} Subir banner</div><h3 style="margin:22px 0 4px">Secciones visibles</h3>${SEC.map((s,i)=>`<div class="swr"><b>${s[0]}</b><label class="sw"><input type="checkbox" ${s[1]?"checked":""} onchange="SEC[${i}][1]=this.checked?1:0;pv()"><i></i></label></div>`).join("")}<button class="btn" style="margin-top:18px;width:100%" onclick="toast('Cambios publicados en la web')">Publicar cambios</button></div><div class="panel prevw"><small style="color:var(--m)">Vista previa</small><div class="prev" id="pvw" style="margin-top:10px"></div></div></div>`}

function openSh(h){$("#shc").innerHTML=h;$("#sh").classList.add("on");$("#shp").scrollTop=0}function closeSh(){$("#sh").classList.remove("on")}
(function(){const g=$("#grab"),p=$("#shp");let y0=0,t0=0,dy=0,d=0;g.onpointerdown=e=>{d=1;y0=e.clientY;t0=performance.now();p.classList.add("drag");g.setPointerCapture(e.pointerId)};g.onpointermove=e=>{if(!d)return;dy=Math.max(0,e.clientY-y0);p.style.transform=`translate(-50%,${dy}px)`};g.onpointerup=g.onpointercancel=()=>{if(!d)return;d=0;p.classList.remove("drag");const v=dy/(performance.now()-t0);p.style.transform="";if(dy>120||v>.6)closeSh();dy=0}})();

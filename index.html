<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ARIA – Panel de administrador</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap"><style>
:root{color-scheme:light;--bg:#fbf7ee;--ink:#10261a;--m:#5d6b62;--g:#0f9d58;--g2:#0a6e3d;--lime:#c9f23d;--or:#ff7a2f;--sky:#d9f1ff;--w:#fff;--l:#e6dfcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sora,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none;cursor:pointer}button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:12px auto 0;max-width:1180px;background:var(--w);border-radius:99px;box-shadow:0 6px 24px #10261a18;display:flex;align-items:center;gap:6px;padding:8px 10px 8px 20px}
.nav img{height:34px}.nav nav{display:flex;gap:2px;flex:1;margin-left:14px;flex-wrap:wrap}.nav nav a{padding:8px 13px;border-radius:99px;font-size:14px;font-weight:600;color:var(--m)}.nav nav a:hover,.nav nav a.on{background:var(--lime);color:var(--ink)}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:99px;padding:12px 24px;font-weight:800;cursor:pointer;font-size:14px;letter-spacing:.02em;transition:transform .15s}.btn:hover{transform:translateY(-2px)}
.btn.o{background:var(--or)}.btn.l{background:var(--lime);color:var(--ink)}.btn.w{background:#fff;color:var(--ink)}.btn.x{background:transparent;border:2px solid currentColor;color:inherit}.btn.s{padding:9px 16px;font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}.sec{padding:72px 0}
h1,h2,h3{line-height:1.05;margin:0}h1{font-size:clamp(38px,6.4vw,76px);font-weight:800;letter-spacing:-.03em}h2{font-size:clamp(28px,4vw,46px);font-weight:800;letter-spacing:-.02em}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:var(--lime);padding:5px 12px;border-radius:99px;margin-bottom:14px}
.hl{background:linear-gradient(transparent 62%,var(--lime) 62%)}.or{color:var(--or)}.gr{color:var(--g)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center;padding:48px 0 64px}
.hero p{font-size:18px;color:var(--m);max-width:520px;margin:18px 0 26px}
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:92px;gap:12px}
.bn{border-radius:26px;overflow:hidden;position:relative;background:var(--w)}.bn img{width:100%;height:100%;object-fit:cover}
.bn.c1{background:var(--g);color:#fff;padding:18px}.bn.c2{background:var(--or);color:#fff;padding:18px}.bn.c3{background:var(--sky);padding:18px}.bn.c4{background:var(--lime);padding:18px}
.bn b{font-size:34px;display:block;line-height:1}.bn span{font-size:13px}
.band{border-radius:40px;margin:0 12px}.gB{background:var(--g);color:#fff}.oB{background:var(--or);color:#fff}.lB{background:var(--lime)}.sB{background:var(--sky)}.dB{background:var(--g2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;text-align:center}.stats b{font-size:clamp(40px,6vw,64px);font-weight:800;display:block;line-height:1}.stats span{opacity:.85;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:14px}
.cat{border-radius:28px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:20px;background:var(--g)}.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#10261ad9)}.cat div{position:relative;z-index:1}.cat h3{font-size:24px}.cat small{font-weight:700;color:var(--lime);letter-spacing:.1em}
.cat.cb{grid-row:span 2;grid-column:span 2}.cat:hover img{transform:scale(1.05)}.cat img{transition:transform .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--w);border-radius:26px;overflow:hidden;box-shadow:0 4px 18px #10261a10;display:flex;flex-direction:column;transition:transform .2s}.card:hover{transform:translateY(-5px)}
.card .im{height:200px;background:var(--sky);display:grid;place-items:center;font-size:64px;overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:18px;display:flex;flex-direction:column;gap:5px;flex:1}.card small{color:var(--m);font-weight:600}.price{font-size:22px;font-weight:800;color:var(--g2)}.card .row{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--lime)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{padding:8px 16px;border-radius:99px;background:var(--w);border:2px solid var(--l);font-weight:700;font-size:14px;cursor:pointer}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.steps5{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:30px}.st{background:#ffffff1f;border-radius:24px;padding:22px}.st i{font-style:normal;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--lime);color:var(--ink);font-weight:800;margin-bottom:12px}.st p{margin:6px 0 0;font-size:14px;opacity:.9}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.panel{background:var(--w);border-radius:28px;padding:26px;box-shadow:0 4px 18px #10261a10}
.big{border-radius:30px;overflow:hidden;background:var(--sky);aspect-ratio:1;display:grid;place-items:center;font-size:120px}.big img{width:100%;height:100%;object-fit:cover}
.spec{width:100%;border-collapse:collapse}.spec td{padding:10px 0;border-bottom:1px solid var(--l)}.spec td:first-child{color:var(--m)}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}input,select,textarea{width:100%;background:var(--bg);border:2px solid var(--l);border-radius:14px;padding:11px 14px}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g)}
.quote{background:var(--w);border-radius:26px;padding:24px}.quote p{margin:0 0 14px}.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--or);color:#fff;font-weight:800;margin-right:10px}
.chipb{display:flex;gap:12px;flex-wrap:wrap}.chipb span{background:var(--w);border-radius:99px;padding:12px 24px;font-weight:800;font-size:18px;box-shadow:0 4px 14px #10261a10}
details{background:var(--w);border-radius:20px;padding:18px 22px;margin-bottom:10px}summary{font-weight:800;cursor:pointer}details p{color:var(--m);margin:10px 0 0}
.tl{border-left:3px solid var(--lime);margin-left:10px;padding-left:22px}.tl div{margin-bottom:22px;position:relative}.tl div:before{content:"";position:absolute;left:-31px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--g)}.tl b{color:var(--g2)}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{text-align:left;padding:12px 6px;border-bottom:1px solid var(--l);font-size:14px}.scroll{overflow-x:auto}
.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--l);background:var(--w);cursor:pointer;font-weight:800}
.tot{display:flex;justify-content:space-between;padding:6px 0}.tot.f{font-size:22px;font-weight:800;border-top:2px solid var(--ink);margin-top:8px;padding-top:12px}
.stp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.stp span{padding:7px 16px;border-radius:99px;background:var(--w);font-weight:700;font-size:13px;border:2px solid var(--l)}.stp .on{background:var(--g);color:#fff;border-color:var(--g)}
.rec{background:#fff;border:2px dashed var(--l);border-radius:20px;padding:26px}.rec th,.rec td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--l);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:99px;font-weight:700;display:none;z-index:50;max-width:90vw}
.ph{border-radius:30px;padding:56px 40px;margin:28px 12px 0}.crumb{font-size:13px;font-weight:700;opacity:.8;margin-bottom:10px}
footer{background:var(--ink);color:#cfe3d6;border-radius:40px 40px 0 0;margin-top:72px;padding:56px 0 28px}footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}footer h4{color:#fff;margin:0 0 12px}footer a{display:block;padding:3px 0;font-size:14px}footer a:hover{color:var(--lime)}
.note{background:var(--sky);border-radius:16px;padding:12px 16px;font-size:14px;margin-top:14px}
.ic{display:inline-block;vertical-align:-.2em;flex:none}.ico{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,var(--lime),#7be0a8);color:var(--g2)}.ib{display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:var(--lime);color:var(--ink);margin-bottom:14px}.okc{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--lime);font-size:34px;font-weight:800}html{scroll-behavior:smooth}input[type=range]{padding:0;accent-color:var(--g)}.map{border-radius:28px;overflow:hidden;min-height:260px;background:var(--sky)}@media(max-width:860px){.hero,.two{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}.cat.cb{grid-column:span 2}footer .cols{grid-template-columns:1fr 1fr}.nav{border-radius:28px;flex-wrap:wrap}.nav nav{order:3;margin:0;width:100%}.ph{padding:36px 22px}}
@media print{.nav,footer,.noprint{display:none!important}body{background:#fff}}
